[project]
name = "session-tts-runtime"
version = "0.1.0"
description = "session-tts runtime: HTTP client + engine bootstrap"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "py7zr>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
