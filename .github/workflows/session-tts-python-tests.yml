name: session-tts python tests

on:
  push:
    branches: [main]
    paths:
      - "session-tts/python/**"
      - "session-tts/scripts/**"
      - "session-tts/skills/**"
      - ".github/workflows/session-tts-python-tests.yml"
  pull_request:
    paths:
      - "session-tts/python/**"
      - "session-tts/scripts/**"
      - "session-tts/skills/**"
      - ".github/workflows/session-tts-python-tests.yml"

jobs:
  test:
    # Text-cleanup and shell-adapter tests with a stub uv; no audio/macOS
    # specifics in scope.
    # Linux runners are faster and cheaper than macOS for this.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-tts/python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pytest
        run: uv run pytest -v
